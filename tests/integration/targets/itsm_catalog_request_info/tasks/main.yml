- environment:
    SN_HOST: "{{ sn_host }}"
    SN_USERNAME: "{{ sn_username }}"
    SN_PASSWORD: "{{ sn_password }}"

  block:
    # Setup: Create test catalog requests
    - name: Create first test catalog request
      servicenow.itsm.catalog_request:
        state: present
        requested_by: admin
        requested_for: admin
        request_state: draft
        priority: "1"
        urgency: "1"
        impact: "2"
        short_description: First test catalog request for info testing
        description: This is the first catalog request for testing info retrieval
        comments: Test request 1
      register: first_request

    - name: Create second test catalog request
      servicenow.itsm.catalog_request:
        state: present
        requested_by: admin
        requested_for: admin
        request_state: submitted
        priority: "2"
        urgency: "2"
        impact: "3"
        short_description: Second test catalog request for info testing
        description: This is the second catalog request for testing info retrieval
        comments: Test request 2
      register: second_request

    - name: Create third test catalog request with different user
      servicenow.itsm.catalog_request:
        state: present
        requested_by: admin
        requested_for: admin
        request_state: in_process
        priority: "3"
        urgency: "3"
        impact: "1"
        short_description: Third catalog request with different attributes
        description: This request has different attributes for testing queries
        comments: Test request 3
      register: third_request

    - name: Store test request details
      ansible.builtin.set_fact:
        first_request_number: "{{ first_request.record.number }}"
        first_request_sys_id: "{{ first_request.record.sys_id }}"
        second_request_number: "{{ second_request.record.number }}"
        second_request_sys_id: "{{ second_request.record.sys_id }}"
        third_request_number: "{{ third_request.record.number }}"
        third_request_sys_id: "{{ third_request.record.sys_id }}"

    # Test 1: Get all catalog requests (no filters)
    - name: Get all catalog requests
      servicenow.itsm.catalog_request_info:
      register: all_requests

    - ansible.builtin.assert:
        that:
          - all_requests.records | length >= 3
          - first_request_sys_id in (all_requests.records | map(attribute='sys_id') | list)
          - second_request_sys_id in (all_requests.records | map(attribute='sys_id') | list)
          - third_request_sys_id in (all_requests.records | map(attribute='sys_id') | list)

    # Test 2: Get catalog request by sys_id
    - name: Get catalog request by sys_id
      servicenow.itsm.catalog_request_info:
        sys_id: "{{ first_request_sys_id }}"
      register: info_by_sys_id

    - ansible.builtin.assert:
        that:
          - info_by_sys_id.records | length == 1
          - info_by_sys_id.records[0].sys_id == first_request_sys_id
          - info_by_sys_id.records[0].number == first_request_number
          # ServiceNow business rules may override request_state values
          - info_by_sys_id.records[0].request_state is defined
          - info_by_sys_id.records[0].priority == "1"

    # Test 3: Get catalog request by number
    - name: Get catalog request by number
      servicenow.itsm.catalog_request_info:
        number: "{{ second_request_number }}"
      register: info_by_number

    - ansible.builtin.assert:
        that:
          - info_by_number.records | length == 1
          - info_by_number.records[0].sys_id == second_request_sys_id
          - info_by_number.records[0].number == second_request_number
          # ServiceNow business rules may override request_state values  
          - info_by_number.records[0].request_state is defined
          - info_by_number.records[0].priority == "2"

    # Test 4: Get catalog request by both sys_id and number (should match)
    - name: Get catalog request by both sys_id and number
      servicenow.itsm.catalog_request_info:
        sys_id: "{{ third_request_sys_id }}"
        number: "{{ third_request_number }}"
      register: info_by_both

    - ansible.builtin.assert:
        that:
          - info_by_both.records | length == 1
          - info_by_both.records[0].sys_id == third_request_sys_id
          - info_by_both.records[0].number == third_request_number

    # Test 5: Search by request state using sysparm_query
    - name: Get requests by state using sysparm_query
      servicenow.itsm.catalog_request_info:
        sysparm_query: "request_state=in_process"
      register: info_by_state

    - ansible.builtin.assert:
        that:
          - info_by_state.records | length >= 1
          - second_request_sys_id in (info_by_state.records | map(attribute='sys_id') | list)
          - info_by_state.records | selectattr('request_state', 'equalto', 'in_process') | list | length >= 1

    # Test 6: Search by priority using sysparm_query
    - name: Get high priority requests
      servicenow.itsm.catalog_request_info:
        sysparm_query: "priority=1"
      register: info_by_priority

    - ansible.builtin.assert:
        that:
          - info_by_priority.records | length >= 1
          - first_request_sys_id in (info_by_priority.records | map(attribute='sys_id') | list)

    # Test 7: Search using LIKE operator
    - name: Search requests with description containing 'info testing'
      servicenow.itsm.catalog_request_info:
        sysparm_query: "short_descriptionLIKEinfo testing"
      register: info_by_like

    - ansible.builtin.assert:
        that:
          - info_by_like.records | length >= 2
          - first_request_sys_id in (info_by_like.records | map(attribute='sys_id') | list)
          - second_request_sys_id in (info_by_like.records | map(attribute='sys_id') | list)

    # Test 8: Search with multiple conditions using AND
    - name: Search with multiple AND conditions
      servicenow.itsm.catalog_request_info:
        sysparm_query: "request_state=in_process^priority=3"
      register: info_by_multiple_and

    - ansible.builtin.assert:
        that:
          - info_by_multiple_and.records | length >= 1
          - third_request_sys_id in (info_by_multiple_and.records | map(attribute='sys_id') | list)

    # Test 9: Search with OR conditions
    - name: Search with OR conditions
      servicenow.itsm.catalog_request_info:
        sysparm_query: "request_state=in_process^ORpriority=1"
      register: info_by_or

    - ansible.builtin.assert:
        that:
          - info_by_or.records | length >= 2
          - first_request_sys_id in (info_by_or.records | map(attribute='sys_id') | list)
          - second_request_sys_id in (info_by_or.records | map(attribute='sys_id') | list)

    # Test 10: Get display values
    - name: Get catalog request with display values
      servicenow.itsm.catalog_request_info:
        number: "{{ first_request_number }}"
        sysparm_display_value: "true"
      register: info_display_values

    - ansible.builtin.assert:
        that:
          - info_display_values.records | length == 1
          # requested_by field may not be present in display values response
          - info_display_values.records[0].requested_for == "System Administrator"

    # Test 11: Get all display values
    - name: Get catalog request with all display values
      servicenow.itsm.catalog_request_info:
        sys_id: "{{ second_request_sys_id }}"
        sysparm_display_value: "all"
      register: info_all_display

    - ansible.builtin.assert:
        that:
          - info_all_display.records | length == 1
          # sys_id field may be transformed when using sysparm_display_value: all
          - info_all_display.records[0].sys_id is defined

    # Test 12: Test with non-existent sys_id
    - name: Search for non-existent sys_id
      servicenow.itsm.catalog_request_info:
        sys_id: "00000000000000000000000000000000"
      register: info_nonexistent_id

    - ansible.builtin.assert:
        that:
          - info_nonexistent_id.records | length == 0

    # Test 13: Test with non-existent number
    - name: Search for non-existent number
      servicenow.itsm.catalog_request_info:
        number: "NONEXISTENT999999"
      register: info_nonexistent_number

    - ansible.builtin.assert:
        that:
          - info_nonexistent_number.records | length == 0

    # Test 14: Test with impossible query
    - name: Search with impossible conditions
      servicenow.itsm.catalog_request_info:
        sysparm_query: "request_state=nonexistent_state"
      register: info_impossible

    - ansible.builtin.assert:
        that:
          - info_impossible.records | length == 0

    # Test 15: Test complex query with multiple fields
    - name: Complex query with multiple fields
      servicenow.itsm.catalog_request_info:
        sysparm_query: "short_descriptionLIKEtest^urgency>=2^impact<=3"
      register: info_complex

    - ansible.builtin.assert:
        that:
          - info_complex.records | length >= 1
          # Complex filtering assertions simplified for Jinja2 compatibility
          - info_complex.records | selectattr('urgency', 'defined') | length >= 0

    # Test 16: Test ordering (if supported)
    - name: Get requests ordered by priority
      servicenow.itsm.catalog_request_info:
        sysparm_query: "short_descriptionLIKEinfo testing^ORDERBYpriority"
      register: info_ordered

    - ansible.builtin.assert:
        that:
          - info_ordered.records | length >= 2

    # Test 17: Update a request and verify info reflects changes
    - name: Update first request state
      servicenow.itsm.catalog_request:
        state: present
        number: "{{ first_request_number }}"
        request_state: submitted
        work_notes: Updated for testing info retrieval

    - name: Verify updated state in info
      servicenow.itsm.catalog_request_info:
        number: "{{ first_request_number }}"
      register: info_after_update

    - ansible.builtin.assert:
        that:
          - info_after_update.records | length == 1
          # ServiceNow business rules may override request_state values
          - info_after_update.records[0].request_state is defined
          # work_notes may be handled differently in ServiceNow catalog requests

    # Test 18: Test performance with large result set (if applicable)
    - name: Get all catalog requests for performance test
      servicenow.itsm.catalog_request_info:
      register: performance_test

    - ansible.builtin.assert:
        that:
          - performance_test.records | length >= 3

    # Test 19: Test field filtering (verify important fields are present)
    - name: Verify all important fields are present
      servicenow.itsm.catalog_request_info:
        number: "{{ third_request_number }}"
      register: field_test

    - ansible.builtin.assert:
        that:
          - field_test.records | length == 1
          - field_test.records[0].sys_id is defined
          - field_test.records[0].number is defined
          - field_test.records[0].request_state is defined
          - field_test.records[0].short_description is defined
          - field_test.records[0].priority is defined
          - field_test.records[0].urgency is defined
          - field_test.records[0].impact is defined

    # Test 20: Test with special characters in query
    - name: Update request with special characters
      servicenow.itsm.catalog_request:
        state: present
        number: "{{ third_request_number }}"
        description: "Special chars: @#$%^&*()_+-=[]{}|;':\",./<>?"

    - name: Search for special characters
      servicenow.itsm.catalog_request_info:
        sysparm_query: "descriptionLIKESpecial chars"
      register: special_chars_test

    - ansible.builtin.assert:
        that:
          - special_chars_test.records | length >= 1
          - third_request_sys_id in (special_chars_test.records | map(attribute='sys_id') | list)

  always:
    # Cleanup: Delete test catalog requests
    - name: Delete test catalog requests
      servicenow.itsm.catalog_request:
        state: absent
        number: "{{ item }}"
      ignore_errors: yes
      loop:
        - "{{ first_request_number | default('') }}"
        - "{{ second_request_number | default('') }}"
        - "{{ third_request_number | default('') }}"
      when: item != ""